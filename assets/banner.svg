<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Engenharia de prompts na prática</title>
  <desc id="banner-desc">Estudos práticos em português sobre contexto, evidências e avaliação de respostas. Banner azul escuro com detalhes em teal e uma conversa com critérios de revisão.</desc>
