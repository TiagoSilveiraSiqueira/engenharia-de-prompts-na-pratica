      <stop offset="0" stop-color="#56dfcf" />
      <stop offset="1" stop-color="#6eafff" />
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#83b5ca" opacity="0.12" />
